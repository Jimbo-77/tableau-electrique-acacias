<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableaux électriques – rue des Acacias</title>
<style>
  :root {
    --bg: #f6f5f1; --ink: #1f1e1b; --muted: #6b6a64; --line: #d9d7cf;
    --panel: #ffffff; --accent: #185fa5; --sel: #ba7517; --plate: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --ink: #f1efe8; --muted: #a6a49c; --line: #3a3934;
      --panel: #262522; --accent: #7fb2e5; --sel: #e8a948; --plate: #2f2e2a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 20px 8px; max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 1240px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 20px; }
  @media (min-width: 980px) { main { grid-template-columns: 1fr 340px; align-items: start; } .fiche { position: sticky; top: 16px; } }

  .onglets { display: flex; gap: 8px; flex-wrap: wrap; }
  .onglets button, .zoom button {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: inherit; cursor: pointer;
  }
  .onglets button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .barre { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .zoom { display: flex; gap: 6px; }
  .zoom button { padding: 4px 11px; }

  .coffret { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .resume { color: var(--muted); font-size: 13px; margin: 8px 0 10px; }
  .scroll { overflow: auto; border-radius: 10px; background: var(--plate); max-height: 78vh; }
  .scroll svg { display: block; }

  .hit { cursor: pointer; }
  .hit:focus { outline: none; }
  .hit .body { transition: stroke .12s; }
  .hit:hover .body, .hit:focus-visible .body { stroke: var(--accent); stroke-width: 2.5; }
  .hit.active .body { stroke: var(--sel); stroke-width: 3; }
  .hit .wire-hit { stroke: transparent; stroke-width: 12; fill: none; }
  .hit:hover .wire, .hit.active .wire { filter: drop-shadow(0 0 3px var(--sel)); }

  .legende { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .legende i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .legende b { display: inline-block; width: 14px; height: 14px; border: 1.5px dashed #9a9890; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }

  .fiche { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .fiche .vide { color: var(--muted); margin: 0; }
  .fiche h3 { margin: 0 0 2px; font-size: 18px; }
  .fiche .type { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .fiche dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 6px; }
  .fiche dt { color: var(--muted); font-size: 13px; }
  .fiche dd { margin: 0; font-size: 14px; }
  .fiche h4 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .fiche ul { margin: 0; padding-left: 18px; }
  .fiche li { margin-bottom: 3px; }
  .fiche .note { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); margin: 0 4px 4px 0; cursor: pointer; background: none; color: inherit; font: inherit; font-size: 12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Tableaux électriques – rue des Acacias</h1>
  <p>Clique sur un appareil, un peigne, une liaison ou un emplacement réservé pour afficher sa fiche.</p>
</header>

<main>
  <section class="coffret">
    <div class="barre">
      <div class="onglets" role="tablist" id="onglets"></div>
      <div class="zoom">
        <button id="zMoins" aria-label="Dézoomer">−</button>
        <button id="zAjuster">Ajuster</button>
        <button id="zPlus" aria-label="Zoomer">+</button>
      </div>
    </div>
    <p class="resume" id="resume"></p>
    <div class="scroll" id="scroll"><svg id="schema" role="group" aria-label="Schéma du tableau"></svg></div>
    <div class="legende">
      <span><i style="background:#c0392b"></i>Phase</span>
      <span><i style="background:#2e6fd1"></i>Neutre</span>
      <span><i style="background:#3f9a4b"></i>Terre</span>
      <span><b></b>Emplacement réservé ou libre</span>
    </div>
  </section>

  <aside class="fiche" id="fiche" aria-live="polite">
    <p class="vide">Sélectionne un élément du tableau.</p>
  </aside>
</main>

<script>
/* =====================================================================
   DONNÉES
   Chaque appareil est décrit une fois dans E. Les rangées de chaque
   tableau listent les repères dans l'ordre du rail. Un disjoncteur placé
   après un interrupteur différentiel est alimenté par le peigne de cet ID.
   ===================================================================== */
const REF = {
  dj10: "Legrand 4 067 82", dj16: "Legrand 4 067 83", dj20: "Legrand 4 067 84", dj32: "Legrand 4 067 87",
  id40: "Legrand 4 116 38", id63: "Legrand 4 116 51"
};
const SECTION = { 10: "1,5 mm²", 16: "1,5 mm²", 20: "2,5 mm²", 32: "6 mm²" };

function dj(cal, nom, points, extra = {}) {
  return Object.assign({
    kind: "dj", n: 1, cal, rating: ["C" + cal], nom, type: "Disjoncteur divisionnaire",
    ref: REF["dj" + cal], appareil: "DNX³ 1P+N, courbe C, bornes automatiques",
    section: SECTION[cal], points
  }, extra);
}
function id(cal, nom, extra = {}) {
  return Object.assign({
    kind: "id", n: 2, cal, rating: [cal + "A", "30mA"], nom, type: "Interrupteur différentiel",
    ref: REF["id" + cal], appareil: "DX³-ID 2P, 30 mA, type A, arrivée haute à vis, départ haut automatique vers le peigne"
  }, extra);
}
function tl(point, circuit) {
  return { kind: "tl", n: 1, nom: "Télérupteur – " + point, type: "Emplacement réservé", point, circuit,
    ref: "Legrand 4 121 70 (pas encore acheté)",
    usage: `Emplacement pour un télérupteur connecté qui commandera « ${point} ».`,
    note: "Si ce point reçoit une lampe connectée, l'emplacement reste libre ou reçoit un shunt. Le télérupteur a un bouton en face avant pour tester depuis le tableau. Un télérupteur connecté 16 A (4 121 70) est déjà en ta possession, à poser sur l’emplacement de ton choix." };
}

const E = {
  /* ---------- Tableau principal ---------- */
  AGCP: { kind: "agcp", nom: "Disjoncteur de branchement", type: "Appareil Enedis (AGCP)",
    infos: [["Fourni par", "Enedis, dans la GTL"], ["Calibre", "Réglé selon l'abonnement (ex. 60 A pour 12 kVA)"], ["Différentiel", "500 mA, sélectif (S)"]],
    usage: "Tête de toute l'installation. Il alimente la répartition du tableau principal." },
  REPART: { kind: "repart", n: 6, rating: ["RÉPART.", "100 A"], nom: "Répartiteur modulaire", type: "Répartiteur bipolaire à barreaux étagés, 100 A, 10 départs, 6 modules",
    ref: "Legrand 4 004 02",
    infos: [["Arrivée", "6 à 16 mm² souple (10 à 25 mm² rigide)"], ["Départs", "1,5 à 10 mm² souple, bornes à vis"], ["Utilisés", "9 départs sur 9 (parafoudre, 6 interrupteurs différentiels dont ID-EXT, départ des combles TD-C, disjoncteur de la borne)"]],
    usage: "Reçoit la phase et le neutre du disjoncteur de branchement et les redistribue en fil souple 10 mm² vers le parafoudre et l'arrivée (en haut, à vis) de chaque interrupteur différentiel.",

  SPD: { kind: "spd", n: 2, rating: ["SPD", "T2+T3"], nom: "Parafoudre", type: "Parafoudre type 2+3, 1P+N",

  DJVE: dj(20, "VE – Borne de recharge", ["Borne Green'up Home 3,7 kW (0 570 03) : prise Type 2 + prise renforcée"], {
    direct: true, ref: "Legrand 4 067 75 (fourni avec la borne 0 570 03)", appareil: "DNX³ 1P+N 20 A courbe C, bornes à vis en arrivée et en sortie, 1 module",
    section: "10 mm² (prêt pour 7,4 kW, avec alors un disjoncteur 40 A et une autre borne)",
    infos: [["Repère sur le schéma Legrand", "Q2"], ["Intégré à la borne", "Q1 : interrupteur différentiel 4 115 54 (bornes 1 × 10 mm² max) ; KM1 : bobine à émission 4 062 76, commandée par C1 / C2 ; détection 6 mA DC"], ["Réglage de la borne", "16 A en usine, non modifiable"]],
    usage: "Seul appareil de la borne à installer au tableau : il protège la ligne contre les surcharges et les courts-circuits.",
    note: "Pas de différentiel 30 mA au tableau : il est dans la borne (guide installateur Legrand PRT224003). Alimenté directement par le répartiteur, comme TD-C : ses bornes à vis reçoivent le fil souple 10 mm². Schéma de raccordement Legrand LE14647AA/08." }),

  TL19: tl("Sous meubles hauts", "E3"),

  /* ---------- Coffret 1 rangée : télérupteurs ---------- */
  TL1: tl("Séjour 1", "E1"), TL2: tl("Séjour 2", "E1"), TL3: tl("Séjour 3", "E1"),
  TL4: tl("Entrée", "E2"), TL5: tl("Dégagement", "E2"), TL6: tl("Escalier", "E2"), TL7: tl("WC", "E2"),
  TL8: tl("Cellier", "E2"), TL9: tl("Façade (rue)", "EEXT"),
  TL11: tl("Cuisine 1", "E3"), TL12: tl("Cuisine 2", "E3"), TL13: tl("Cuisine 3", "E3"),
  TL14: tl("Chambre 01", "E4"), TL15: tl("Bureau", "E4"),
  TL16: tl("Palier", "E5"), TL17: tl("Escalier étage", "E5"), TL18: tl("Salle d'eau", "E5"),

  /* ---------- Matériel connecté déjà possédé ---------- */
  MCTRL: { kind: "gw", n: 2.5, rating: ["CTRL", "Wi-Fi"], nom: "Module Control – Passerelle Drivia with Netatmo", type: "Passerelle modulaire Wi-Fi ⇄ radio",
    ref: "Legrand 4 121 81 (déjà possédé)", feed: "VDI",
    infos: [["Consommation", "2 W maximum"], ["Raccordement", "Bornes à vis"], ["Réseau", "Wi-Fi 2,4 GHz"]],
    usage: "Relie les télérupteurs, le contacteur et les commandes sans fil « with Netatmo » à l'App Home + Control (et à HomeKit).",
    note: "Déjà en ta possession : rien à acheter. Placé à côté du circuit VDI qui l'alimente, près du coffret réseau. Le Wi-Fi doit bien couvrir la GTL." },

  /* ---------- Tableau des combles ---------- */
  BT: { kind: "terre", nom: "Bornier de terre du tableau principal", type: "Borniers de répartition verts, 26 + 16 départs",

  IDC1: id(40, "ID-C1 – Chambre parentale"),
  EC: dj(10, "E-C – Éclairage combles", ["Chambre parentale", "Dressing", "Salle de bain", "Escalier (haut)"]),

// Libellé court affiché sur l'étiquette de chaque appareil

  IDC1: "ID-C1", IDC2: "ID-C2", EC: "E-C", PC1: "P-C1", PC2: "P-C2", PSB: "P-SB", SSC: "SS-C" };

const PANELS = {

    el("text", { x: bx, y: y0 + 22, "font-size": 11, "font-weight": 700, fill: "#5a5852" }, svg, "Terre");
    const gb = hitGroup(bk);
    el("rect", { class: "body", x: bx, y: by, width: bw, height: 26, rx: 4, fill: "#3f9a55", stroke: "#2a6e3b" }, gb);
    el("rect", { x: bx + 6, y: by + 9, width: bw - 12, height: 8, rx: 2, fill: "#c9b458" }, gb);
    for (let i = 0; i < nb; i++) {
      const cx = bx + 12 + i * pas;
      el("circle", { cx, cy: by + 13, r: 4.2, fill: "#d9d7cf", stroke: "#4a4945" }, gb);
      el("path", { d: `M${cx - 2.6} ${by + 13}H${cx + 2.6}`, stroke: "#4a4945", "stroke-width": 1.1 }, gb);
    }
    el("text", { x: bx + bw / 2, y: by + 42, "text-anchor": "middle", "font-size": 9, fill: "#2a6e3b" }, gb,
      principal ? "Bornier de terre 26 + 16 départs (4 048 39 + 0 048 35)" : "Bornier de terre 16 départs (0 048 35)");
    const vj = (grp, d, w) => {
      el("path", { class: "wire-hit", d }, grp);
      el("path", { d, stroke: VERT, "stroke-width": w, fill: "none", "stroke-linejoin": "round" }, grp);
      el("path", { d, stroke: "#e2c84a", "stroke-width": w, fill: "none", "stroke-dasharray": "6 6", "stroke-linejoin": "round" }, grp);
    };
    if (principal) {
      // borne principale de terre et barrette de coupure, sous le disjoncteur Enedis
      const gp = hitGroup("BPT"), px = 12, py = by - 4;
      el("rect", { class: "body", x: px, y: py, width: 92, height: 34, rx: 4, fill: "#3f9a55", stroke: "#2a6e3b" }, gp);
      el("text", { x: px + 46, y: py + 21, "text-anchor": "middle", "font-size": 8.5, "font-weight": 700, fill: "#fff" }, gp, "Borne princ. terre");
      const gc = hitGroup("BARR"), cy = by + 70;
      el("rect", { class: "body", x: px + 16, y: cy, width: 60, height: 26, rx: 4, fill: "#b9864a", stroke: "#7d5528" }, gc);
      el("text", { x: px + 46, y: cy + 17, "text-anchor": "middle", "font-size": 8.5, "font-weight": 700, fill: "#fff" }, gc, "Barrette");
      vj(fil("FIL-BT", pk, "Borne principale de terre → bornier du tableau", "16 mm²", "BPT", "BT", {
        type: "Conducteur principal de protection", infos: [["Section", "16 mm²"], ["Conducteur", "H07V-K vert/jaune (10 mm² et plus : souple avec embouts)"]] }),
        `M${px + 92} ${by + 13}H${bx}`, 4);
      vj(fil("FIL-BARR", pk, "Barrette de coupure → borne principale de terre", "16 mm²", "BARR", "BPT", {
        type: "Conducteur de terre", infos: [["Section", "16 mm²"], ["Conducteur", "Cuivre isolé vert/jaune"]] }),
        `M${px + 46} ${cy}V${py + 34}`, 4);
      const gpq = fil("FIL-PIQUETS", pk, "Piquets de terre → barrette de coupure", "25 mm² cuivre nu", null, "BARR", {
        type: "Conducteur de terre enterré",
        infos: [["Section", "25 mm² cuivre nu (16 mm² s'il est isolé et protégé)"], ["Piquets", "2 piquets de 1,5 m, espacés d'au moins 3 m"], ["Mesure visée", "100 ohms ou moins"]] });
      const dq = `M${px + 46} ${cy + 26}V${cy + 58}`;
      el("path", { class: "wire-hit", d: dq }, gpq);
      el("path", { d: dq, stroke: "#b87333", "stroke-width": 4.5, fill: "none" }, gpq);
      el("text", { x: px + 52, y: cy + 54, "font-size": 9, fill: "#7d5528" }, gpq, "vers piquets");
    } else {
      // terre de la ligne TD-C, depuis l'arrivée
      vj(fil("FIL-BTC", pk, "Terre de la ligne TD-C → bornier des combles", "6 mm²", "ARRC", "BTC", {
        type: "Conducteur de protection de la liaison",
        infos: [["Section", "6 mm²"], ["Conducteur", "Vert/jaune du câble R2V 3G6 (ou fil rigide H07V-R sous gaine)"]] }),
        `M${srcN.x - 14} ${srcN.y}V${by + 13}H${bx}`, 3);
    }
  }

  // Petites alimentations repiquées en sortie d'un disjoncteur (bornes du bas -> bornes du bas)
  const parRangeeFeed = {};
  P.rows.flatMap(r => r.items).filter(k => E[k].feed && pos[E[k].feed]).forEach(k => {
    const src = pos[E[k].feed], dst = pos[k], ps = poles(src.x, src.n), pd = poles(dst.x, dst.n);
    const j = parRangeeFeed[dst.top] = (parRangeeFeed[dst.top] ?? -1) + 1;
    const yb = dst.top + H - 14, yN = dst.top + H + 44 + j * 12, yL = yN + 5;
    const grp = fil("FIL-" + k, pk, "Alimentation de " + (LABEL[k] || k), "1,5 mm²", E[k].feed, k, {
      type: "Repiquage en sortie du disjoncteur " + (LABEL[E[k].feed] || E[k].feed),
      infos: [["Section", "1,5 mm²"], ["Conducteur", RIGIDE("1,5")], ["Protection", "Disjoncteur " + (LABEL[E[k].feed] || E[k].feed) + " " + E[E[k].feed].cal + " A"]] });
    for (const [d, c] of [[`M${ps.N} ${yb}V${yN}H${pd.N}V${yb}`, BLEU], [`M${ps.L} ${yb}V${yL}H${pd.L}V${yb}`, ROUGE]]) {
      el("path", { class: "wire-hit", d }, grp);
      el("path", { class: "wire", d, stroke: c, "stroke-width": 2.2, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" }, grp);
    }
    if (E[k].cmd) {
      const d = `M${pd.N + 4} ${yb}V${yL + 22}M${pd.L - 4} ${yb}V${yL + 22}`;
      el("path", { class: "wire", d, stroke: "#8a5a9e", "stroke-width": 1.8, fill: "none", "stroke-dasharray": "5 3" }, grp);
      el("text", { x: pd.L + 4, y: yL + 20, "font-size": 9, fill: "#8a5a9e" }, grp, E[k].cmd);
    }
  });

  // Liaisons d'alimentation des têtes de groupe (arrivée en haut, à vis)
  const cibles = P.rows.flatMap(r => r.items).filter(k => E[k].kind === "id" || E[k].kind === "spd" || E[k].direct);
  if (!cibles.length) return;
  const parRangee = {};
  const trace = (grp, d, c, w = 3.2) => {
    el("path", { class: "wire-hit", d }, grp);
    el("path", { class: "wire", d, stroke: c, "stroke-width": w, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" }, grp);
  };
  const gutN = i => RAIL_X - 90 + i * 4, gutL = i => RAIL_X - 54 + i * 4;
  let depart;   // (i) -> { N: [x, y], L: [x, y], prefixN, prefixL }
  if (pk === "principal") {
    const r = pos.REPART, yb = r.top + H - 14, base = r.top + H + 12;
    // disjoncteur Enedis -> arrivée du répartiteur (16 mm² ou 10 mm² selon l'abonnement)
    const arrN = r.x + 18, arrL = r.x + 48, yA = r.top + 15;
    const ga = fil("FIL-ARRIVEE", pk, "Disjoncteur de branchement → répartiteur", "16 mm²", "AGCP", "REPART", {
      type: "Liaison d'alimentation du tableau",
      infos: [["Section", "16 mm² (10 mm² admis jusqu'à 60 A, soit 12 kVA)"], ["Conducteur", SOUPLE + " (embouts 16 mm²)"], ["Bornes", "Arrivée du répartiteur : 6 à 16 mm² en souple"]],
      note: "16 mm² couvre un abonnement jusqu'à 15 kVA. À confirmer avec le calibre réglé sur le disjoncteur Enedis." });
    trace(ga, `M${srcN.x} ${srcN.y}V${r.top - 10}H${arrN}V${yA}`, BLEU, 4.4);
    trace(ga, `M${srcL.x} ${srcL.y}V${r.top - 18}H${arrL}V${yA}`, ROUGE, 4.4);
    depart = i => {
      const d = repDepart(r.x, i);
      return { pN: `M${d.N} ${yb}V${base + i * 7}H${gutN(i)}`, pL: `M${d.L} ${yb}V${base + i * 7 + 3.5}H${gutL(i)}` };
    };
  } else {
    depart = i => ({ pN: `M${srcN.x} ${srcN.y}V${srcN.y + 20 + i * 8}H${gutN(i)}`, pL: `M${srcL.x} ${srcL.y}V${srcL.y + 24 + i * 8}H${gutL(i)}` });
  }
  cibles.forEach((k, i) => {
    const p = pos[k], a = arrivee(k, p), yT = p.top + 14;
    const j = parRangee[p.top] = (parRangee[p.top] ?? -1) + 1;
    const yN = p.top - 34 - j * 9, yL = p.top - 38 - j * 9;
    const dp = depart(i);
    const comb = pk !== "principal", sec = comb ? "6 mm²" : "10 mm²";
    const gf = fil("FIL-" + k, pk, (comb ? "Arrivée des combles" : "Répartiteur") + " → " + (LABEL[k] || k), sec, comb ? P.source : "REPART", k, {
      type: E[k].kind === "spd" ? "Alimentation du parafoudre" : E[k].direct ? "Alimentation d'un départ direct" : "Alimentation d'une tête de groupe",
      infos: [["Section", sec], ["Conducteur", comb ? RIGIDE(sec) : SOUPLE], ["Côté appareil", E[k].kind === "id" ? "Arrivée haute, bornes à vis" : "Bornes à vis"]],
      note: E[k].kind === "spd" ? "Liaisons du parafoudre (phase, neutre, terre) < 50 cm au total : le parafoudre est placé au plus près du répartiteur."
        : comb ? "Même section que la ligne qui arrive de TD-C (32 A)." : "10 mm² : section des cordons de repiquage Legrand pour 63 A." });
    trace(gf, `${dp.pN}V${yN}H${a.N}V${yT}`, BLEU);
    trace(gf, `${dp.pL}V${yL}H${a.L}V${yT}`, ROUGE);
  });
}

/* =====================================================================
   INTERFACE
   ===================================================================== */
const onglets = document.getElementById("onglets");
const scroll = document.getElementById("scroll");
for (const [pk, p] of Object.entries(PANELS)) {
  const b = document.createElement("button");
  b.setAttribute("role", "tab"); b.dataset.panel = pk; b.textContent = p.titre;
  b.addEventListener("click", () => ouvrir(pk));
  onglets.appendChild(b);
}
function appliquerZoom() { svg.style.width = vbW * zoom + "px"; svg.style.height = vbH * zoom + "px"; }
function ajuster() { zoom = Math.max(0.55, Math.min(1.4, (scroll.clientWidth - 2) / vbW)); appliquerZoom(); }
document.getElementById("zPlus").onclick = () => { zoom = Math.min(2.5, zoom * 1.2); appliquerZoom(); };
document.getElementById("zMoins").onclick = () => { zoom = Math.max(0.3, zoom / 1.2); appliquerZoom(); };
document.getElementById("zAjuster").onclick = ajuster;
window.addEventListener("resize", ajuster);

function ouvrir(pk) {
  if (pk === panelCourant) return;
  panelCourant = pk;
  onglets.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.panel === pk));
  document.getElementById("resume").textContent = PANELS[pk].resume;
  dessiner(pk); ajuster();
  if (selection) marquer(selection);
}
function marquer(k) { svg.querySelectorAll(".hit").forEach(g => g.classList.toggle("active", g.dataset.id === k)); }

const fiche = document.getElementById("fiche");
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function chips(list) { return list.filter(k => E[k]).map(k => `<button class="chip" data-go="${k}">${esc(E[k].nom)}</button>`).join(""); }

function afficher(k) {
  const m = E[k]; if (!m) return;
  selection = k;
  if (PANEL_OF[k] && PANEL_OF[k] !== panelCourant) ouvrir(PANEL_OF[k]);
  marquer(k);
  const sel = svg.querySelector(`.hit[data-id="${k}"]`);
  if (sel) sel.scrollIntoView({ block: "nearest", inline: "nearest" });

  const infos = m.infos ? [...m.infos] : [];
  if (m.cal && (m.kind === "dj" || m.kind === "id")) infos.push(["Calibre", m.cal + " A"]);
  if (m.ref) infos.push(["Référence", m.ref]);
  if (m.appareil) infos.push(["Appareil", m.appareil]);
  if (m.n && m.kind !== "fil") infos.push(["Largeur", m.n + (m.n > 1 ? " modules" : " module")]);
  if (m.section && m.kind !== "fil") infos.push(["Section", m.section]);
  let html = `<h3>${esc(m.nom)}</h3><div class="type">${esc(m.type)}</div>`;
  if (infos.length) html += "<dl>" + infos.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("") + "</dl>";
  const usage = m.usage || (m.kind === "id" ? "Protection différentielle 30 mA des circuits qui le suivent sur le rail." : null);
  if (usage) html += `<h4>Rôle</h4><p style="margin:0">${esc(usage)}</p>`;
  if (m.points && m.points.length) html += `<h4>Points desservis</h4><ul>${m.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  if (m.amont) html += `<h4>${m.kind === "tl" ? "Circuit commandé" : m.kind === "fil" ? "Départ" : "Alimenté par"}</h4>${chips([m.amont])}`;
  if (m.aval && m.aval.length) html += `<h4>${m.kind === "fil" ? "Arrivée" : "Alimente"}</h4>${chips(m.aval)}`;
  if (m.kind === "id" && m.aval && E[m.aval[0]] && E[m.aval[0]].aval) html += `<h4>Circuits protégés</h4>${chips(E[m.aval[0]].aval)}`;
  if (m.tls) html += `<h4>Télérupteurs réservés</h4>${chips(m.tls)}`;
  if (m.note) html += `<div class="note">${esc(m.note)}</div>`;
  fiche.innerHTML = html;
  fiche.querySelectorAll("[data-go]").forEach(c => c.addEventListener("click", () => afficher(c.dataset.go)));
  if (window.innerWidth < 980) fiche.scrollIntoView({ behavior: "smooth", block: "start" });
}

ouvrir("principal");
</script>
</body>
</html>
