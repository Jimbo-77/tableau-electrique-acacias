<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau électrique – rue des Acacias (exemple)</title>
<style>
  :root {
    --bg: #f6f5f1; --ink: #1f1e1b; --muted: #6b6a64; --line: #d9d7cf;
    --panel: #ffffff; --accent: #185fa5; --sel: #ba7517;
    --plate: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --ink: #f1efe8; --muted: #a6a49c; --line: #3a3934;
      --panel: #262522; --accent: #7fb2e5; --sel: #e8a948; --plate: #2f2e2a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 20px 8px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 20px; }
  @media (min-width: 880px) { main { grid-template-columns: 1fr 340px; align-items: start; } }

  .coffret { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .coffret h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); letter-spacing: .03em; }
  .coffret svg { width: 100%; height: auto; display: block; background: var(--plate); border-radius: 10px; }

  /* Éléments cliquables du schéma */
  .hit { cursor: pointer; }
  .hit:focus { outline: none; }
  .hit:focus-visible .body, .hit:focus-visible .wire-hit { stroke: var(--accent); stroke-width: 3; }
  .hit .body { transition: stroke .12s; }
  .hit:hover .body { stroke: var(--accent); stroke-width: 2; }
  .hit.active .body { stroke: var(--sel); stroke-width: 3; }
  .hit .wire-hit { stroke: transparent; stroke-width: 14; fill: none; }
  .hit:hover .wire, .hit.active .wire { filter: drop-shadow(0 0 3px var(--sel)); }
  .hit.active .peigne-body { stroke: var(--sel); stroke-width: 2.5; }

  .legende { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legende i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }

  .fiche { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .fiche .vide { color: var(--muted); margin: 0; }
  .fiche h3 { margin: 0 0 2px; font-size: 18px; }
  .fiche .type { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .fiche dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 14px; }
  .fiche dt { color: var(--muted); font-size: 13px; }
  .fiche dd { margin: 0; font-size: 14px; }
  .fiche h4 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .fiche ul { margin: 0; padding-left: 18px; }
  .fiche li { margin-bottom: 3px; }
  .fiche .note { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); margin: 0 4px 4px 0; cursor: pointer; background: none; color: inherit; font: inherit; font-size: 12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Tableau électrique – rue des Acacias</h1>
  <p>Exemple : disjoncteur de branchement, un interrupteur différentiel et deux disjoncteurs. Clique sur un appareil, le peigne ou un câble.</p>
</header>

<main>
  <section class="coffret" aria-label="Tableau principal">
    <h2>TABLEAU PRINCIPAL · RANGÉE 3 (extrait)</h2>
    <svg id="schema" viewBox="0 0 580 400" role="group" aria-label="Schéma du tableau"></svg>
    <div class="legende">
      <span><i style="background:#c0392b"></i>Phase</span>
      <span><i style="background:#2e6fd1"></i>Neutre</span>
      <span><i style="background:#9a9890"></i>Peigne / gaine</span>
    </div>
  </section>

  <aside class="fiche" id="fiche" aria-live="polite">
    <p class="vide">Sélectionne un élément du tableau.</p>
  </aside>
</main>

<script>
/* ---------- Données ----------
   Un objet par élément. Pour les appareils sur le rail, "modules" donne la largeur
   (1 module = 17,5 mm) et l'ordre du tableau donne la position. */
const ELEMENTS = {
  AGCP: {
    nom: "Disjoncteur de branchement", type: "Appareil Enedis (AGCP)",
    infos: [["Fourni par", "Enedis, posé dans la GTL"], ["Calibre", "Réglé selon l'abonnement (ex. 60 A pour 12 kVA)"], ["Différentiel", "500 mA, sélectif (type S)"]],
    usage: "Tête de toute l'installation. Il alimente le tableau principal par un câble de liaison.",
    aval: ["LIAISON"]
  },
  LIAISON: {
    nom: "Liaison disjoncteur de branchement → tête de rangée", type: "Câble de liaison",
    infos: [["Conducteurs", "Fil souple H07V-K avec embouts"], ["Section", "10 mm² jusqu'à 12 kVA, 16 mm² au-delà"], ["Longueur", "La plus courte possible"]],
    usage: "Amène la phase (rouge) et le neutre (bleu) du disjoncteur de branchement jusqu'à l'arrivée de l'interrupteur différentiel ID3.",
    remarques: "Dans le tableau réel, cette liaison alimente toutes les têtes de rangée (peigne vertical ou cordons de repiquage). La section dépend de l'abonnement final.",
    amont: "AGCP", aval: ["ID3"]
  },
  ID3: {
    nom: "Interrupteur différentiel ID3", type: "Interrupteur différentiel", modules: 2,
    rating: ["40A", "30mA"], kind: "id",
    infos: [["Référence", "Legrand 4 116 38"], ["Appareil", "DX³-ID 2P, 30 mA, type A"], ["Raccordement", "Arrivée à vis, départ automatique vers le peigne"], ["Largeur", "2 modules"]],
    usage: "Protection différentielle 30 mA des circuits d'éclairage (E1 à E5), volets roulants et VMC.",
    remarques: "Le bouton T permet de tester le déclenchement : à faire une fois par mois.",
    amont: "LIAISON", aval: ["PEIGNE"]
  },
  PEIGNE: {
    nom: "Peigne d'alimentation", type: "Peigne HX³ universel 1P+N",
    infos: [["Référence", "Legrand 4 049 28 (18 modules, découpable)"]],
    usage: "Distribue la phase et le neutre de l'interrupteur différentiel à tous les disjoncteurs de la rangée, sans fil.",
    remarques: "Indispensable avec les disjoncteurs à bornes automatiques : ils ne s'alimentent que par le peigne.",
    amont: "ID3", aval: ["E3", "P3"]
  },
  E3: {
    nom: "Disjoncteur E3 – Éclairage cuisine", type: "Disjoncteur divisionnaire", modules: 1,
    rating: ["C10"], kind: "dj",
    infos: [["Référence", "Legrand 4 067 82"], ["Appareil", "DNX³ 1P+N, courbe C, bornes automatiques"], ["Section", "1,5 mm²"]],
    usage: "Éclairage de la cuisine, câblé en étoile depuis le tableau (une ligne par point).",
    points: ["Plafonnier cuisine 1", "Plafonnier cuisine 2", "Plafonnier cuisine 3", "Éclairage sous meubles hauts (boîte en attente pour le driver LED)"],
    remarques: "Un emplacement de télérupteur connecté est réservé par point d'éclairage.",
    amont: "PEIGNE", depart: "vers cuisine · 1,5 mm²"
  },
  P3: {
    nom: "Disjoncteur P3 – Prises plan de travail", type: "Disjoncteur divisionnaire", modules: 1,
    rating: ["C20"], kind: "dj",
    infos: [["Référence", "Legrand 4 067 84"], ["Appareil", "DNX³ 1P+N, courbe C, bornes automatiques"], ["Section", "2,5 mm² (gaine préfilée Ø 20 mm)"]],
    usage: "Prises au-dessus du plan de travail et sur l'îlot (6 prises au maximum).",
    points: ["4 prises au plan de travail", "2 prises sur l'îlot"],
    remarques: "Exemple : dans le tableau réel, P3 est en rangée 2, sous l'ID2.",
    amont: "PEIGNE", depart: "vers cuisine · 2,5 mm²"
  }
};
const RAIL = ["ID3", "E3", "P3"];   // ordre des appareils sur le rail
const RESERVE = 5;                   // emplacements libres dessinés après les appareils

/* ---------- Dessin ---------- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("schema");
const U = 40;            // largeur d'un module en px
const Y0 = 120;          // haut des modules
const H = 168;           // hauteur des modules
const RAIL_X = 170;      // début des appareils sur le rail
const ROUGE = "#c0392b", BLEU = "#2e6fd1";

function el(name, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function hitGroup(id) {
  const g = el("g", { class: "hit", "data-id": id, tabindex: 0, role: "button", "aria-label": ELEMENTS[id].nom });
  g.addEventListener("click", () => afficher(id));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); afficher(id); } });
  return g;
}

// Dégradés
const defs = el("defs");
const grad = el("linearGradient", { id: "gBody", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
el("stop", { offset: "0", "stop-color": "#ffffff" }, grad);
el("stop", { offset: "1", "stop-color": "#e9e7e1" }, grad);
const gradA = el("linearGradient", { id: "gAgcp", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
el("stop", { offset: "0", "stop-color": "#d9d8d3" }, gradA);
el("stop", { offset: "1", "stop-color": "#bcbab3" }, gradA);
const gradR = el("linearGradient", { id: "gRail", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
el("stop", { offset: "0", "stop-color": "#d5d4cf" }, gradR);
el("stop", { offset: ".5", "stop-color": "#a9a8a2" }, gradR);
el("stop", { offset: "1", "stop-color": "#c9c8c2" }, gradR);

// Rail DIN (35 mm) avec ses lumières
const railW = (RAIL.reduce((s, id) => s + ELEMENTS[id].modules, 0) + RESERVE) * U + 30;
el("rect", { x: RAIL_X - 15, y: Y0 + H / 2 - 12, width: railW, height: 24, rx: 2, fill: "url(#gRail)" });
for (let x = RAIL_X - 5; x < RAIL_X - 15 + railW - 10; x += 22)
  el("rect", { x, y: Y0 + H / 2 - 3, width: 12, height: 6, rx: 3, fill: "#8d8c86" });

// Bornes : position x des pôles (N à gauche, phase à droite)
function poles(x, n) { return n === 2 ? { N: x + 20, L: x + 60 } : { N: x + 12, L: x + 28 }; }

function bornes(g, x, n, y, mode) {
  const p = poles(x, n);
  el("rect", { x: x + 3, y, width: n * U - 6, height: 22, rx: 2, fill: "#dddbd4" }, g);
  for (const cx of [p.N, p.L]) {
    if (mode === "auto") {
      el("rect", { x: cx - 5, y: y + 4, width: 10, height: 14, rx: 2, fill: "#3a3936" }, g);
      el("rect", { x: cx - 3, y: y + 6, width: 6, height: 4, rx: 1, fill: "#f2a33a" }, g);
    } else {
      el("circle", { cx, cy: y + 11, r: 6.5, fill: "#cfcdc6", stroke: "#85837c", "stroke-width": 1 }, g);
      el("path", { d: `M${cx - 4} ${y + 11}H${cx + 4}M${cx} ${y + 7}V${y + 15}`, stroke: "#5c5b56", "stroke-width": 1.4 }, g);
    }
  }
}

// Appareil modulaire (disjoncteur ou interrupteur différentiel)
const pos = {};
let cursor = RAIL_X;
RAIL.forEach(id => {
  const m = ELEMENTS[id], n = m.modules, x = cursor, w = n * U - 2;
  pos[id] = { x, n, p: poles(x, n) };
  const g = hitGroup(id);
  el("rect", { class: "body", x, y: Y0, width: w, height: H, rx: 4, fill: "url(#gBody)", stroke: "#b9b6ad", "stroke-width": 1 }, g);
  // bornes haut / bas
  bornes(g, x, n, Y0 + 4, "auto");
  bornes(g, x, n, Y0 + H - 26, m.kind === "id" ? "vis" : "auto");
  // face avant
  el("rect", { x: x + 5, y: Y0 + 32, width: w - 10, height: 86, rx: 3, fill: "#f8f7f4", stroke: "#d4d1c8" }, g);
  // marquage
  el("text", { x: x + w / 2, y: Y0 + 46, "text-anchor": "middle", "font-size": 10, "font-weight": 700, fill: "#2b2a27" }, g, m.rating[0]);
  if (m.rating[1]) el("text", { x: x + w / 2, y: Y0 + 112, "text-anchor": "middle", "font-size": 9, fill: "#55534d" }, g, m.rating[1]);
  // manette (position I = enclenché)
  const lw = n === 2 ? 30 : 16, lx = x + w / 2 - lw / 2;
  el("text", { x: x + w / 2, y: Y0 + 58, "text-anchor": "middle", "font-size": 8, fill: "#8a887f" }, g, "I");
  el("rect", { x: lx, y: Y0 + 61, width: lw, height: 36, rx: 3, fill: "#2c2b29" }, g);
  el("rect", { x: lx + 2, y: Y0 + 63, width: lw - 4, height: 14, rx: 2, fill: "#565550" }, g);
  el("text", { x: x + w / 2, y: Y0 + 106, "text-anchor": "middle", "font-size": 8, fill: "#8a887f" }, g, m.kind === "id" ? "" : "O");
  // bouton test de l'ID
  if (m.kind === "id") {
    el("circle", { cx: x + w - 14, cy: Y0 + 46, r: 7, fill: "#e6e4dd", stroke: "#85837c" }, g);
    el("text", { x: x + w - 14, y: Y0 + 49.5, "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#3a3936" }, g, "T");
  }
  // étiquette du repère
  el("rect", { x: x + 4, y: Y0 + 122, width: w - 8, height: 16, rx: 2, fill: "#fffef8", stroke: "#cfccc2" }, g);
  el("text", { x: x + w / 2, y: Y0 + 134, "text-anchor": "middle", "font-size": 10, "font-weight": 700, fill: "#2b2a27" }, g, id);
  cursor += n * U;
});
// emplacements libres
for (let i = 0; i < RESERVE; i++)
  el("rect", { x: cursor + i * U, y: Y0, width: U - 2, height: H, rx: 4, fill: "none", stroke: "#b9b6ad", "stroke-dasharray": "4 4" });
el("text", { x: cursor + RESERVE * U / 2, y: Y0 + H + 18, "text-anchor": "middle", "font-size": 10, fill: "#8a887f" }, svg, "emplacements libres");

// Disjoncteur de branchement (à gauche, hors rail)
{
  const g = hitGroup("AGCP"), x = 20, y = 70, w = 104, h = 210;
  el("rect", { class: "body", x, y, width: w, height: h, rx: 6, fill: "url(#gAgcp)", stroke: "#8f8d86" }, g);
  el("rect", { x: x + 10, y: y + 34, width: w - 20, height: 92, rx: 4, fill: "#e9e8e3", stroke: "#a3a19a" }, g);
  el("text", { x: x + w / 2, y: y + 52, "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#2b2a27" }, g, "500 mA  S");
  el("rect", { x: x + w / 2 - 18, y: y + 62, width: 36, height: 42, rx: 4, fill: "#2c2b29" }, g);
  el("rect", { x: x + w / 2 - 15, y: y + 65, width: 30, height: 16, rx: 2, fill: "#565550" }, g);
  el("text", { x: x + w / 2, y: y + 118, "text-anchor": "middle", "font-size": 8, fill: "#55534d" }, g, "réglage selon abo.");
  el("text", { x: x + w / 2, y: y + 22, "text-anchor": "middle", "font-size": 9, fill: "#3a3936" }, g, "Branchement");
  // bornes de sortie (bas)
  for (const cx of [x + 32, x + 72]) {
    el("circle", { cx, cy: y + h - 18, r: 7.5, fill: "#cfcdc6", stroke: "#6f6d66" }, g);
    el("path", { d: `M${cx - 4.5} ${y + h - 18}H${cx + 4.5}M${cx} ${y + h - 22.5}V${y + h - 13.5}`, stroke: "#4a4945", "stroke-width": 1.4 }, g);
  }
  el("text", { x: x + w / 2, y: y - 8, "text-anchor": "middle", "font-size": 10, fill: "#8a887f" }, svg, "disjoncteur Enedis");
  pos.AGCP = { N: x + 32, L: x + 72, y: y + h - 18 };
}

// Liaison disjoncteur de branchement → arrivée de l'ID (bornes du bas)
{
  const g = hitGroup("LIAISON"), id = pos.ID3, yb = Y0 + H - 15;
  const dN = `M${pos.AGCP.N} ${pos.AGCP.y}V350H${id.p.N}V${yb}`;
  const dL = `M${pos.AGCP.L} ${pos.AGCP.y}V335H${id.p.L}V${yb}`;
  for (const [d, c] of [[dN, BLEU], [dL, ROUGE]]) {
    el("path", { class: "wire-hit", d }, g);
    el("path", { class: "wire", d, stroke: c, "stroke-width": 5, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
  }
  el("text", { x: 150, y: 372, "font-size": 10, fill: "#8a887f" }, g, "liaison 10/16 mm²");
}

// Peigne : du départ de l'ID (bornes du haut) aux arrivées des disjoncteurs
{
  const g = hitGroup("PEIGNE");
  const ids = ["ID3", "E3", "P3"];
  const x1 = pos.ID3.x + 6, x2 = pos.P3.x + U - 8, yb = 92;
  el("rect", { class: "body peigne-body", x: x1, y: yb, width: x2 - x1, height: 16, rx: 4, fill: "#b9b7b0", stroke: "#8f8d86" }, g);
  el("line", { x1: x1 + 4, x2: x2 - 4, y1: yb + 5, y2: yb + 5, stroke: BLEU, "stroke-width": 2.5 }, g);
  el("line", { x1: x1 + 4, x2: x2 - 4, y1: yb + 11, y2: yb + 11, stroke: ROUGE, "stroke-width": 2.5 }, g);
  ids.forEach(id => {
    const p = pos[id].p;
    el("rect", { x: p.N - 3, y: yb + 14, width: 6, height: Y0 + 14 - yb - 14, fill: BLEU, rx: 1 }, g);
    el("rect", { x: p.L - 3, y: yb + 14, width: 6, height: Y0 + 14 - yb - 14, fill: ROUGE, rx: 1 }, g);
  });
  el("text", { x: x1, y: yb - 6, "font-size": 10, fill: "#8a887f" }, g, "peigne 1P+N");
}

// Départs des disjoncteurs (vers les gaines)
["E3", "P3"].forEach(id => {
  const p = pos[id].p, yb = Y0 + H - 15, cx = pos[id].x + U / 2 - 1;
  el("path", { d: `M${p.N} ${yb}V${yb + 26}`, stroke: BLEU, "stroke-width": 3, fill: "none" });
  el("path", { d: `M${p.L} ${yb}V${yb + 26}`, stroke: ROUGE, "stroke-width": 3, fill: "none" });
  el("rect", { x: cx - 13, y: yb + 24, width: 26, height: 34, rx: 8, fill: "#9a9890", opacity: .85 });
});

/* ---------- Fiche ---------- */
const fiche = document.getElementById("fiche");
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function chips(list) { return list.map(id => `<button class="chip" data-go="${id}">${esc(ELEMENTS[id].nom)}</button>`).join(""); }

function afficher(id) {
  const m = ELEMENTS[id];
  svg.querySelectorAll(".hit").forEach(g => g.classList.toggle("active", g.dataset.id === id));
  let html = `<h3>${esc(m.nom)}</h3><div class="type">${esc(m.type)}</div>`;
  html += "<dl>" + m.infos.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") + "</dl>";
  html += `<h4>Rôle</h4><p style="margin:0">${esc(m.usage)}</p>`;
  if (m.points) html += `<h4>Points desservis</h4><ul>${m.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  if (m.depart) html += `<h4>Départ</h4><p style="margin:0">${esc(m.depart)}</p>`;
  if (m.amont) html += `<h4>Alimenté par</h4>${chips([m.amont])}`;
  if (m.aval) html += `<h4>Alimente</h4>${chips(m.aval)}`;
  if (m.remarques) html += `<div class="note">${esc(m.remarques)}</div>`;
  fiche.innerHTML = html;
  fiche.querySelectorAll("[data-go]").forEach(c => c.addEventListener("click", () => afficher(c.dataset.go)));
  if (window.innerWidth < 880) fiche.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
</html>
